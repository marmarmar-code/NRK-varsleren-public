name: NRK journal monitor

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Hva vil du gjøre?"
        required: true
        default: "dry-run"
        type: choice
        options:
          - bootstrap
          - dry-run
          - test-source
          - test-slack
          - test-event-slack
          - run
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: nrk-journal-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production dependencies
        run: python -m pip install .
      - name: Resolve operation
        id: operation
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            operation="run"
          else
            operation="${{ inputs.operation }}"
          fi
          echo "value=$operation" >> "$GITHUB_OUTPUT"
      - name: Record source state before monitoring
        if: steps.operation.outputs.value != 'test-event-slack'
        id: before
        shell: bash
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "state_blob=$(git rev-parse HEAD:state/monitor_state.json)" >> "$GITHUB_OUTPUT"
      - name: Run finite monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACKWEBHOOK }}
        shell: bash
        run: |
          operation="${{ steps.operation.outputs.value }}"
          case "$operation" in
            bootstrap) command=(python -m nrk_journal_monitor bootstrap) ;;
            dry-run) command=(python -m nrk_journal_monitor check --dry-run) ;;
            test-source) command=(python -m nrk_journal_monitor test-source) ;;
            test-slack) command=(python -m nrk_journal_monitor test-slack) ;;
            test-event-slack) command=(python -m nrk_journal_monitor test-event-slack) ;;
            run) command=(python -m nrk_journal_monitor run) ;;
            *) echo "Unsupported operation." >&2; exit 2 ;;
          esac
          "${command[@]}"
      - name: Reject concurrent branch or state changes
        if: steps.operation.outputs.value != 'test-event-slack'
        shell: bash
        run: |
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$default_branch"
          latest_head=$(git rev-parse "origin/$default_branch")
          latest_state_blob=$(git rev-parse "origin/$default_branch:state/monitor_state.json")
          if [[ "$latest_head" != "${{ steps.before.outputs.head }}" ]]; then
            echo "Default branch advanced during the run; refusing to overwrite it." >&2
            exit 1
          fi
          if [[ "$latest_state_blob" != "${{ steps.before.outputs.state_blob }}" ]]; then
            echo "State changed during the run; refusing to overwrite it." >&2
            exit 1
          fi
      - name: Commit state only when changed
        if: steps.operation.outputs.value != 'test-event-slack'
        shell: bash
        run: |
          if git diff --quiet -- state/monitor_state.json; then
            echo "State unchanged; no commit needed."
            exit 0
          fi
          git config user.name "nrk-journal-monitor[bot]"
          git config user.email "nrk-journal-monitor[bot]@users.noreply.github.com"
          git add -- state/monitor_state.json
          changed=$(git diff --cached --name-only)
          if [[ "$changed" != "state/monitor_state.json" ]]; then
            echo "Refusing to commit files outside monitor state." >&2
            exit 1
          fi
          git commit -m "Update NRK journal monitor state [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

  notify-scheduled-failure:
    needs: monitor
    if: >-
      always() && github.event_name == 'schedule' &&
      needs.monitor.result != 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Send fixed Slack failure alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACKWEBHOOK }}
        run: python -m nrk_journal_monitor notify-failure
