[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nrk-journal-monitor"
version = "0.1.0"
description = "Varsler når en ny offentlig journalperiode først observeres hos NRK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "curl_cffi==0.16.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
